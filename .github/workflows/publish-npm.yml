name: Publish to npm

# Publishes @lambda-house/teob-ts to npmjs.com.
#
# Manual only: a public release happens when someone dispatches this workflow, never from a tag push.
#
# Runs on teob-cc's own runners for public repositories ([self-hosted, test-public]), never on GitHub-hosted
# ones. npm's OIDC trusted publishing and --provenance work on GitHub-hosted runners only ("Self-hosted runners
# are not currently supported", docs.npmjs.com/trusted-publishers), so this publishes with a token and without
# provenance.
#
# Secret: NPM_TOKEN — a granular npmjs.com access token with read/write on @lambda-house/teob-ts only
# (npmjs.com → Access Tokens → Granular; it expires, renew it there).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty for package.json version)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, test-public]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run test:ci
      - run: pnpm run build

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Set version
        run: npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "### Published to npmjs.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** @lambda-house/teob-ts" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://www.npmjs.com/package/@lambda-house/teob-ts" >> $GITHUB_STEP_SUMMARY
